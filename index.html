<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Ranked Log</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <div class="container">
    <header>
      <h1>Ranked Match History</h1>
      <div id="stats-summary"></div>
    </header>

    <div class="table-wrapper">
      <table id="matches-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Hero</th>
            <th>MMR</th>
            <th>Change</th>
            <th>Duration</th>
            <th>Draft (Dire / Radiant)</th>
            <th>LVL</th>
            <th>K</th>
            <th>D</th>
            <th>A</th>
            <th>LH</th>
            <th>DN</th>
            <th>NET</th>
            <th>GPM</th>
            <th>XPM</th>
            <th>Match ID</th>
          </tr>
        </thead>
        <tbody id="matches-body">
          <!-- Populated by app.js -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <script src="app.js"></script>
</body>
</html>
