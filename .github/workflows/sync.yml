name: stats-sync

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  sync:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071342992:role/RankedStatsGitHubRole
          aws-region: us-west-2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Tracker
        run: dotnet run --project src/Tracker.csproj

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ constants/

          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync Dota 2 match history"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new matches found. Skipping commit."
          fi
